(()=>{'use strict';
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
let K=8;const b=(n,k=K)=>n.toString(2).padStart(k,'0');let index=0,timer=null,arrivalTimer=null,states=[],rounds=[],M=181,Q=214;
function build(m,q,k=K){const mask=(1<<k)-1;let p=0,cur=q;const ss=[{phase:'init',round:0,p,q:cur,c:0}],rr=[];
for(let r=1;r<=k;r++){const bit=cur&1,a=p>>k,l=p&mask,x=bit?m:0,sum=a+x,c=sum>>k,s=sum&mask;
const base={round:r,p,q:cur,c:0,bit,a,l,x,sum,s};ss.push({...base,phase:'select'});ss.push({...base,phase:'add'});ss.push({...base,phase:'write',p:(s<<k)|l,c});p=((sum<<k)|l)>>1;cur>>=1;ss.push({...base,phase:'shift',p,q:cur,c:0,oldC:c});rr.push({r,bit,a,x,sum,c,s,l,p});}
return{ss,rr};}
function el(tag,attrs,text){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;}
function bits(target,val,count,x,y,w,hot,shift){const root=$(target);root.replaceChildren();for(let i=0;i<count;i++){const role=target==='qBits'?'q':i===0?'c':i<=K?'a':'l';root.append(el('rect',{x:x+i*w,y,width:w,height:42,class:(Array.isArray(hot)?hot.includes(i):hot===i)?`cell part-${role} bitHot`:`cell part-${role}`}));const g=el('g',{'transform':`translate(${x+i*w+w/2},${y+30})`});g.append(el('text',{'text-anchor':'middle',class:`mono tone-${role}`+(shift&&i>0?' shiftBit':''),style:`--slide-step:-${w}px`},b(val,count)[i]));root.append(g);}}
function active(ids){document.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));ids.forEach(id=>$(id).classList.add('active'));}
function moving(path,color='#f18916'){const e=el('circle',{r:5,fill:color,opacity:'0'});e.append(el('animateMotion',{dur:'.65s',path,fill:'freeze'}));e.append(el('animate',{attributeName:'opacity',values:'0;1;1;0',keyTimes:'0;.05;.8;1',dur:'.65s',fill:'freeze'}));$('motion').append(e);}
function showAdder(s,waiting=false){
$('adderInputA').textContent=waiting?'输入 A：待到达':`输入 A：${b(s.a)}`;
$('adderInputB').textContent=waiting?'输入 B：待到达':`输入 B：${b(s.x)}`;
$('adderCout').textContent=waiting?'输出 Cout：—':`输出 Cout：${s.sum>>K}`;
$('adderSum').textContent=waiting?'输出 S：—':`输出 S：${b(s.s)}`;
$('addEquation').textContent=waiting?'等待输入…':`${b(s.a)} + ${b(s.x)} = ${b(s.sum,K+1)}`;
}
function render(animate=true){if(arrivalTimer!==null){clearTimeout(arrivalTimer);arrivalTimer=null;}const s=states[index],ph=s.phase,r=s.round;const sh=animate&&ph==='shift';
bits('qBits',s.q,K,520,84,240/K,ph==='select'?K-1:-1,sh);bits('pBits',(s.c<<(2*K))|s.p,2*K+1,130,250,630/(2*K+1),ph==='write'?Array.from({length:K+1},(_,i)=>i):-1,sh);
$('mBits').textContent=b(M);$('qValue').textContent=`Q = ${b(s.q)}₂（${s.q}）`;$('qBitLabel').textContent=ph==='select'?`q₀=${s.bit}`:'';
$('muxValue').textContent=ph==='init'?'—':ph==='select'?(s.bit?'选中 M':'选中 0'):b(s.x);showAdder(s,!['add','write','shift'].includes(ph));
$('busSum').replaceChildren();$('motion').replaceChildren();
const names={init:'初始化',select:'① 取最低位 / 选择',add:'② 加法',write:`③ 填入进位与${K}位和`,shift:`④ ${2*K+1}位整体右移`};
$('stepLabel').textContent=ph==='init'?'初始化':`第 ${r} / ${K} 轮 · ${names[ph]}`;$('calculation').textContent=`${M} × ${Q} = ${M*Q}　｜　${index} / ${4*K} 步`;
let note='',ids=[];
if(ph==='init'){note=`被乘数 M=${b(M)}，乘数 Q=${b(Q)}。${2*K+1} 位 C｜A｜L 全部清零；每轮只取原高 ${K} 位 A 参加加法。`;}
if(ph==='select'){ids=['qControl'];note=`Q 的最低位 q₀=${s.bit}，控制 Mux 选中${s.bit?'被乘数 M':'常数 0'}。当前只确定选择；Mux 输出与另一个加数将在下一步同时送入加法器。`;}
if(ph==='add'){ids=['highWire','muxWire',s.bit?'mWire':'zeroWire'];note=`加法器计算：高半部 ${b(s.a)} + ${b(s.x)} = ${b(s.sum,K+1)}。得到 ${K} 位和 S=${b(s.s)}、1 位进位 Cout=${s.sum>>K}；结果还在加法器输出端，${2*K+1} 个寄存器位暂时保持不变。`;}
if(ph==='write'){ids=['sumWire','carryWire'];note=`先把进位 ${s.c} 填入最左侧第 ${2*K+1} 位 C，再把 ${K} 位和 ${b(s.s)} 填回原高 ${K} 位 A；低 ${K} 位 L=${b(s.l)} 保持。现在是 ${s.c}｜${b(s.s)}｜${b(s.l)}，尚未右移。`;if(animate){moving('M425 680V725H110V170H340V215','#147ac2');moving('M275 640H65V235H130','#d1456b');}}
if(ph==='shift'){ids=[];const prev=states[index-1];note=`${s.oldC}｜${b(s.s)}｜${b(s.l)} 整体右移 → 0｜${b(s.p,2*K).slice(0,K)}｜${b(s.p,2*K).slice(K)}。第 ${2*K+1} 位补 0，原进位进入 A 的最高位，A 末位进入 L；原最低位 ${s.l&1} 移出。Q 同时从 ${b(prev.q)} 右移到 ${b(s.q)}。`;
if(animate){const ghost=el('text',{x:790,y:280,class:'travel tone-l'},String(s.l&1));ghost.append(el('animate',{attributeName:'opacity',from:'1',to:'0',dur:'.8s',fill:'freeze'}));$('motion').append(ghost);}}
if(ph==='add'&&animate){
showAdder(s,true);
$('muxValue').textContent=b(s.x);
moving('M350 521V560','#cb760d');moving('M340 295V324H690V535H520V560','#147ac2');
note=`Mux 输出 ${b(s.x)} 与高 ${K} 位 ${b(s.a)} 同时沿两条输入通路进入加法器，待两个输入到达后显示计算结果。`;
arrivalTimer=setTimeout(()=>{arrivalTimer=null;showAdder(s);$('note').textContent=`两个加数均已到达：${b(s.a)} + ${b(s.x)} = ${b(s.sum,K+1)}。得到进位 Cout=${s.sum>>K} 和 ${K} 位和 S=${b(s.s)}；下一步分别沿红线、蓝线回写。`;},650);
}
const done=index===4*K;$('output').textContent=done?`${b(s.p,2*K)}₂ = ${s.p}`:'';if(done)note+=` ${K} 轮完成：${M} × ${Q} = ${s.p}。`;
$('note').textContent=note;active(ids);$('prev').disabled=index===0;$('next').disabled=done;
$('history').innerHTML=rounds.map(t=>`<tr class="${r===t.r?'current':''}"><td>${t.r}</td><td>${t.bit}</td><td class="code">${b(t.a)} + ${b(t.x)} = ${b(t.sum,K+1)}</td><td class="code">${t.c}｜${b(t.s)}｜${b(t.l)}</td><td class="code">0｜${b(t.p,2*K).slice(0,K)}｜${b(t.p,2*K).slice(K)}</td></tr>`).join('');
}
function stop(){if(timer!==null)clearInterval(timer);timer=null;$('play').textContent=index===4*K?'重新播放':'自动播放';}
function step(delta){index=Math.max(0,Math.min(4*K,index+delta));render();if(index===4*K)stop();else if(timer===null)$('play').textContent='自动播放';}
function start(){stop();if(index===4*K){index=0;render(false);} $('play').textContent='暂停';timer=setInterval(()=>step(1),Number($('speed').value));}
function reset(){const m=Number($('mInput').value),q=Number($('qInput').value);if(!Number.isInteger(m)||m<0||m>((1<<K)-1)||!Number.isInteger(q)||q<0||q>((1<<K)-1)){alert(`请输入 0～${(1<<K)-1} 的整数。`);return;}stop();M=m;Q=q;const data=build(M,Q);states=data.ss;rounds=data.rr;index=0;render(false);$('play').textContent='自动播放';}
